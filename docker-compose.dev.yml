
# This file extends docker-compose.yml for local development
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - GIN_MODE=debug
    volumes:
      - ./backend:/app
    command: go run ./cmd/server/main.go

  frontend:
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  postgres:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_INITDB_ARGS=-c log_statement=all

  # Optional: Add adminer for database management
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - member-network
